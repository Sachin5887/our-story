<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Henry × Maryam</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="app">

        <!-- OPENING SCENE -->
        <section class="scene active" id="opening">

            <div class="particles"></div>

            <div class="intro">
                <p class="eyebrow">A LITTLE PIECE OF US</p>

                <h1>
                    HENRY
                    <span>×</span>
                    MARYAM
                </h1>

                <p class="intro-text">
                    Two people.<br>
                    One story.<br>
                    A thousand moments worth remembering.
                </p>

                <button id="beginBtn">
                    <span>♡</span>
                    BEGIN OUR STORY
                    <span>♡</span>
                </button>
            </div>

        </section>


        <!-- STORY SCENE -->
        <section class="scene" id="beginning">

            <div class="scene-content">

                <p class="chapter">CHAPTER 01</p>

                <h2>Our Story Begins</h2>

                <div class="line"></div>

                <p>
                    Every beautiful story has a beginning.
                    Ours is somewhere between two people
                    who didn't know what was waiting for them.
                </p>

                <button class="nextBtn">
                    CONTINUE →
                </button>

            </div>

        </section>


        <!-- FUTURE SCENES WILL GO HERE -->

    </main>

    <script src="script.js"></script>

</body>
</html>
